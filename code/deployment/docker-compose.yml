services:
  api:
    build:
      context: ../..
      dockerfile: code/deployment/api/Dockerfile
    environment:
      MODEL_DIR: /app/models/current
      MODEL_CACHE_DIR: /tmp/route-agent-model-cache
    volumes:
      - ../../models/current:/app/models/current:ro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  app:
    build:
      context: ../..
      dockerfile: code/deployment/app/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
